<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="loginstyle.css">
</head>
<body>

<main class="card" id="card">

  <section class="panel panel-signin">
    <h1>Sign in</h1>
   
  <form id="login-form">

   <label for="email">Email
    <input type="email" id="email" name="email" required>
    </label>

    <label for="password">Password
    <div>
      <input type="password" id="password" name="password" required>
    </div>
    </label>

    <button type="submit" class="btn">Sign in</button>
    <p id="login-error" role="alert"></p>

    <p><a href="#" id="forgot-password-link">Forgot Password?</a></p>
  </form>



    <p class="switch">No account? <button type="button" data-switch="signup">Sign up</button></p>
  </section>

  
<section class="panel panel-signup" inert>
  <h1>Create account</h1>

  <form id="signup-form">

    <label for="signup-username">Username
      <input type="text" id="signup-username" required>

    </label>

    <label for="signup-email">Email

      <input type="email" id="signup-email" required>

    </label>


    <label for="signup-password">Password
      <input type="password" id="signup-password"
             minlength="8" required>
    </label>

    <button type="submit" class="btn">Sign up</button>
    <p id="signup-error" role="alert"></p>
  </form>

  <p class="switch">
    Have an account?
    <button type="button" data-switch="signin">Sign in</button>
  </p>
</section>

<!-- Forgot Password Panel -->
<section class="panel panel-forgot" inert>

  <h1>Reset Password</h1>

  <form id="forgot-form">

    <label for="reset-email">
      Email
      <input 
      type="email"
      id="reset-email"
      required>

    </label>


    <button type="submit" class="btn">
      Send Code
    </button>


    <p id="forgot-message"></p>

  </form>


  <form id="verify-form" style="display:none;">

    <label>
      Verification Code

      <input 
      type="text"
      id="reset-code"
      maxlength="6"
      required>

    </label>


    <label>
      New Password

      <input
      type="password"
      id="new-password"
      minlength="8"
      required>

    </label>



    <label>
      Confirm Password

      <input
      type="password"
      id="confirm-password"
      minlength="8"
      required>

    </label>



    <button type="submit" class="btn">
      Change Password
    </button>


    <p id="reset-message"></p>


  </form>


  <p class="switch">

    Remember your password?

    <button type="button" id="back-to-login">
      Sign in
    </button>

  </p>


</section>

  <div class="overlay-wrap">
    <div class="overlay">

      <div class="overlay-img img-left"></div>
      <div class="overlay-img img-right"></div>

      <div class="overlay-panel overlay-left" inert>
        <h2>Already have an account?</h2>
        <button type="button" class="btn-ghost" data-switch="signin">Sign in</button>
      </div>
      <div class="overlay-panel overlay-right">
        <h2>New here?</h2>
        <button type="button" class="btn-ghost" data-switch="signup">Sign up</button>
      </div>
    </div>
  </div>

</main>

<script src="login.js"></script>
</body>
</html>
