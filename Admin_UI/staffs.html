<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staffs</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="staffs">
<div class="layout">

  <nav class="sidebar">
    <img class="logo" src="logo.jpg" alt="logo">
    <br>
    <a href="dashboard.html"><img src="icons/dashboardwhite.png" alt="Dashboard"> Dashboard</a>
    <a href="staffs.html" class="active"><img src="icons/barberwhite.png" alt="barber"> Staffs</a>
    <a href="services.html"><img src="icons/Scissors_Icon.png" alt="service"> Services</a>
    <a href="appointments.html"><img src="icons/appointmentwhite.png" alt="appointment"> Appointments</a>
    <a href="feedback.html"><img src="icons/customerwhite.png" alt="Feedback"> Feedback</a>
    <a href="archives.html"><img src="icons/appointmentwhite.png" alt="Archives"> Archives</a>
    <a href="login-activity.html">Login Activity</a>
    <a href="index.html" class="logout"><img src="icons/logout (2).png" alt="logout"> Log out</a>
  </nav>

  <main class="main">
    <div class="toolbar">
      <h2>Staffs</h2>
      <button id="add-btn">Add staff</button>
    </div>

    <div class="archive-bulk-toolbar">
      <label class="archive-select-all-label">
        <input type="checkbox" id="select-all-active-staff">
        Select All
      </label>
      <span id="active-staff-selected-count">0 selected</span>
      <button type="button" id="archive-selected-staff" class="archive-record-btn" disabled>
        Archive Selected
      </button>
    </div>

    <!-- Rows are filled in by script.js -->
    <div class="card table-wrap">
      <table>

    <thead>
        <tr>
            <th>Select</th>
            <th>Name</th>
            <th>Specialization</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>

        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

</div>
<script src="script.js"></script>
<script src="auth.js"></script>
<script src="logout.js"></script>
</body>
</html>
