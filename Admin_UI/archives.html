
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Archives</title>

    <link rel="icon" type="image/png" href="icons/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="archives">

<div class="layout">

    
    <nav class="sidebar">

        <img class="logo" src="logo.jpg" alt="Sañado's Barbershop">
        <br>

        <a href="dashboard.html">
            <img src="icons/dashboardwhite.png" alt="">
            Dashboard
        </a>

        <a href="staffs.html">
            <img src="icons/barberwhite.png" alt="">
            Staffs
        </a>

        <a href="services.html">
            <img src="icons/Scissors_Icon.png" alt="">
            Services
        </a>

        <a href="appointments.html">
            <img src="icons/appointmentwhite.png" alt="">
            Appointments
        </a>

        <a href="feedback.html">
            <img src="icons/customerwhite.png" alt="">
            Feedback
        </a>

        <a href="archives.html" class="active">
            <img src="icons/appointmentwhite.png" alt="">
            Archives
        </a>

        <a href="login.html" class="logout">
            <img src="icons/logout (2).png" alt="">
            Log out
        </a>

    </nav>

    <!-- MAIN CONTENT -->
    <main class="main">

        <div class="toolbar">
            <h1>Archives</h1>
        </div>

        <!-- ARCHIVE CATEGORIES -->
        <div class="archive-tabs">

            <button type="button"
                    class="archive-tab active"
                    data-archive-tab="appointments">
                Appointments
            </button>

            <button type="button"
                    class="archive-tab"
                    data-archive-tab="feedback"
                    disabled>
                Feedback
            </button>

            <button type="button"
                    class="archive-tab"
                    data-archive-tab="barbers"
                    disabled>
                Barbers
            </button>

            <button type="button"
                    class="archive-tab"
                    data-archive-tab="services"
                    disabled>
                Services
            </button>

        </div>

        <!-- ARCHIVED APPOINTMENTS -->
        <section id="archived-appointments-section">

            <h2>Archived Appointments</h2>


<div class="appointment-filters">

    <input
        type="search"
        id="archive-search"
        placeholder="Search customer, service, or barber..."
    >

    <select id="archive-status-filter">
        <option value="all">All Status</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
    </select>

    <input
        type="date"
        id="archive-date-filter"
        title="Filter by appointment date"
    >

    <select id="archive-sort">
        <option value="newest">Recently Archived</option>
        <option value="oldest">Oldest Archived</option>
        <option value="name-asc">Customer Name: A–Z</option>
        <option value="name-desc">Customer Name: Z–A</option>
    </select>

    <button type="button" id="reset-archive-filters">
        Reset Filters
    </button>

</div>


            <p id="archived-appointments-count"
               aria-live="polite">
                Loading archived appointments...
            </p>

            <div class="card table-wrap">

                <table>
                    <thead>
                        <tr>
                            <th>Date &amp; time</th>
                            <th>Client</th>
                            <th>Service</th>
                            <th>Preferred staff</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Archived on</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="archived-appointments-rows">
                        <tr>
                            <td colspan="8" class="empty">
                                Loading archived appointments...
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>

            <div id="archives-pagination"
                 class="pagination-container"
                 aria-live="polite">
            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>
<script src="auth.js"></script>

</body>
</html>
