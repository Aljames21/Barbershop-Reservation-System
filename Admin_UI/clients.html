<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clients</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="clients">
<div class="layout">

  <nav class="sidebar">
    <img class="logo" src="logo.jpg" alt="logo">
    <br>
    <a href="dashboard.html"><img src="icons/dashboardwhite.png" alt="Dashboard"> Dashboards</a>
    <a href="staffs.html"><img src="icons/barberwhite.png" alt="barber"> Staffs</a>
    <a href="clients.html" class="active"><img src="icons/customerwhite.png" alt="client"> Clients</a>
    <a href="appointments.html"><img src="icons/appointmentwhite.png" alt="appointment"> Appointments</a>
    <a href="feedback.html"><img src="icons/customerwhite.png" alt="Feedback"> Feedback</a>
    <a href="index.html" class="logout"><img src="icons/logout (2).png" alt="logout"> Log out</a>
  </nav>

  <main class="main">
    <div class="toolbar">
      <h2>Clients</h2>
      <button id="add-btn">Add client</button>
    </div>

    <!-- Rows are filled in by script.js -->
    <div class="card table-wrap">
      <table>
        <thead>
          <tr><th>Name</th><th>Phone</th><th>Preferred staff</th><th>Last visit</th><th>Total visits</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

</div>
<script src="script.js"></script>
<script src="auth.js"></script>
</body>
</html>
