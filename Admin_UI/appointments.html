<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appointments</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="stylesheet" href="style.css">
  
</head>
    <body data-page="appointments">

        <div>
      <div class="layout">

        <nav class="sidebar">
          <img class="logo" src="logo.jpg" alt="logo">
          <br>
          <a href="dashboard.html"><img src="icons/dashboardwhite.png" alt="Dashboard"> Dashboard</a>
          <a href="staffs.html"><img src="icons/barberwhite.png" alt="barber"> Staffs</a>
          <a href="services.html"><img src="icons/Scissors_Icon.png" alt="service"> Services</a>
          <a href="appointments.html" class="active"><img src="icons/appointmentwhite.png" alt="appointment"> Appointments</a>
          <a href="feedback.html"><img src="icons/customerwhite.png" alt="Feedback"> Feedback</a>
          <a href="archives.html"><img src="icons/appointmentwhite.png" alt="Archives">Archives</a>
          <a href="login.html" class="logout"><img src="icons/logout (2).png" alt="logout"> Log out</a>
        </nav>

        <main class="main">
          <div class="toolbar">
            <h1>Appointments</h1>
          </div>

      <div class="appointment-filters">

        <input
          type="search"
          id="appointment-search"
          placeholder="Search customer, service, or barber..."
        >

        <select id="appointment-status-filter">
          <option value="all">All Status</option>
          <option value="Pending">Pending</option>
          <option value="Confirmed">Confirmed</option>
          <option value="Completed">Completed</option>
          <option value="Cancelled">Cancelled</option>
        </select>

        <input
          type="date"
          id="appointment-date-filter"
        >

        <select id="appointment-barber-filter">
          <option value="all">All Barbers</option>
        </select>

              <select id="appointment-sort">
        <option value="newest">Appointment Date: Latest </option>
        <option value="oldest">Appointment Date: Earliest</option>
        <option value="name-asc">Customer Name: A–Z</option>
        <option value="name-desc">Customer Name: Z–A</option>
      </select>

        <button type="button" id="reset-appointment-filters">
          Reset Filters
        </button>

      </div>

      <p id="appointment-results-count" aria-live="polite"></p>

            <!-- APPOINTMENT ARCHIVE SELECTION -->
      <div class="appointment-bulk-actions">

        <label for="select-all-appointments">
          <input type="checkbox" id="select-all-appointments">
          Select All
        </label>

        <span id="selected-appointments-count">
          0 selected
        </span>

        <button
          type="button"
          id="archive-selected-appointments"
          disabled>
          Archive Selected
        </button>

      </div>

          <!-- Rows are filled in by script.js -->
          <div class="card table-wrap">
            <table>
              <thead>
               <tr>
                <th></th>
                <th>Date &amp; time</th>
                <th>Client</th>
                <th>Service</th>
                <th>Preferred staff</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>

          <div id="appointments-pagination" class="pagination-container" aria-live="polite">
            </div>
        </main>

      </div>
      <script src="script.js"></script>
      <script src="auth.js"></script>
      </body>
      </html>
