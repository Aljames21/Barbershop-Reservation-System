<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="dashboard">
  <div class="layout">

    <nav class="sidebar">
      <img class="logo" src="logo.jpg" alt="logo">
      <br>

      <a href="dashboard.html" class="active">
        <img src="icons/dashboardwhite.png" alt="Dashboard">
        Dashboard
      </a>

      <a href="staffs.html">
        <img src="icons/barberwhite.png" alt="barber">
        Staffs
      </a>

      <a href="services.html">
        <img src="icons/appointmentwhite.png" alt="service">
        Services
      </a>

      <a href="appointments.html">
        <img src="icons/appointmentwhite.png" alt="appointment">
        Appointments
      </a>

      <button id="logout-btn" class="logout">
        <img src="icons/logout (2).png" alt="logout">
        Log out
      </button>
    </nav>

    <main class="main">
      <h2>Dashboard</h2>

      <!-- Earnings Summary -->
      <div class="stats">
        <div class="card stat">
          <p>Earned today</p>
          <strong id="earn-today">₱0</strong>
        </div>

        <div class="card stat">
          <p>Earned this week</p>
          <strong id="earn-week">₱0</strong>
        </div>

        <div class="card stat">
          <p>Earned this month</p>
          <strong id="earn-month">₱0</strong>
        </div>
      </div>

      <!-- Business Overview -->
      <div class="stats">
        <div class="card stat">
          <p>Total Appointments</p>
          <strong id="total-appointments">0</strong>
        </div>

        <div class="card stat">
          <p>Pending Requests</p>
          <strong id="pending-appointments">0</strong>
        </div>

        <div class="card stat">
          <p>Active Barbers</p>
          <strong id="active-barbers">0</strong>
        </div>

        <div class="card stat">
          <p>Total Clients</p>
          <strong id="total-clients">0</strong>
        </div>
      </div>

    </main>
  </div>

  <script src="script.js"></script>
  <script src="auth.js"></script>
  <script src="logout.js"></script>
</body>
</html>
