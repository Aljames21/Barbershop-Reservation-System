<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Feedback</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="feedback">
  <div class="layout">
    <nav class="sidebar">
      <img class="logo" src="logo.jpg" alt="logo">
      <br>
      <a href="dashboard.html"><img src="icons/dashboardwhite.png" alt="Dashboard"> Dashboard</a>
      <a href="staffs.html"><img src="icons/barberwhite.png" alt="Staffs"> Staffs</a>
      <a href="services.html"><img src="icons/Scissors_Icon.png" alt="Services"> Services</a>
      <a href="appointments.html"><img src="icons/appointmentwhite.png" alt="Appointments"> Appointments</a>
      <a href="feedback.html" class="active"><img src="icons/customerwhite.png" alt="Feedback"> Feedback</a>
      <a href="archives.html"><img src="icons/appointmentwhite.png" alt="Archives"> Archives</a>
      <a href="login-activity.html">Login Activity</a>
      <a href="index.html" class="logout"><img src="icons/logout (2).png" alt="Log out"> Log out</a>
    </nav>

    <main class="main">
      <div class="toolbar">
        <h1>Customer Feedback</h1>
      </div>
      <p id="feedback-status" class="error" role="status" aria-live="polite"></p>
      <section class="card feedback-rating-summary" aria-labelledby="feedback-rating-heading">
        <h2 id="feedback-rating-heading">Rating overview</h2>
        <div class="feedback-rating-metrics">
          <div class="feedback-rating-metric">
            <span>Average rating</span>
            <strong id="feedback-average-rating">—</strong>
          </div>
          <div class="feedback-rating-metric">
            <span>Approved reviews</span>
            <strong id="feedback-approved-count">0</strong>
          </div>
        </div>
        <div id="feedback-rating-distribution" class="feedback-rating-distribution" aria-label="Approved review ratings by star count"></div>
      </section>
      <div class="card table-wrap feedback-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Customer</th>
              <th>Rating</th>
              <th>Comment</th>
              <th>Service</th>
              <th>Submitted</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="feedback-rows">
            <tr><td colspan="7" class="empty">Loading feedback...</td></tr>
          </tbody>
        </table>
      </div>
      <div id="feedback-pagination" class="pagination-container" aria-live="polite">
      </div>
      
    </main>
  </div>

  <script src="auth.js"></script>
  <script src="feedback-rating-utils.js"></script>
  <script src="feedback.js"></script>
  <script src="logout.js"></script>
</body>
</html>
