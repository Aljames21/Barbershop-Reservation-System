
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services Management</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="services">
<div class="layout">

  <nav class="sidebar">
    <img class="logo" src="logo.jpg" alt="Sañado's Barbershop logo">
    <br>

    <a href="dashboard.html">
      <img src="icons/dashboardwhite.png" alt=""> Dashboard
    </a>

    <a href="staffs.html">
      <img src="icons/barberwhite.png" alt=""> Staffs
    </a>

    <a href="services.html" class="active">
      <img src="icons/Scissors_Icon.png" alt="service"> Services
    </a>

    <a href="appointments.html">
      <img src="icons/appointmentwhite.png" alt=""> Appointments
    </a>

    <a href="feedback.html">
      <img src="icons/customerwhite.png" alt="Feedback"> Feedback
    </a>

    <a href="archives.html">
      <img src="icons/archive.png" alt="Archives"> 
      Archives
    </a>

    <a href="login-activity.html">Login Activity</a>

    <a href="index.html" class="logout">
      <img src="icons/logout (2).png" alt=""> Log out
    </a>
  </nav>

  <main class="main">

    <div class="toolbar">
      <h1>Services Management</h1>
      <button id="add-btn">Add service</button>
    </div>

    <!-- SERVICES SEARCH AND FILTERS -->
<div class="services-filter-toolbar">

  <div class="services-search">
    <input
      type="search"
      id="services-search"
      placeholder="Search service name or description..."
      aria-label="Search services"
    >
  </div>

      <div class="services-filter-group">

        <select id="services-status-filter" aria-label="Filter by status">
          <option value="all">All Status</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>

        <select id="services-price-sort" aria-label="Sort services by price">
          <option value="default">Default Order</option>
          <option value="low-high">Price: Low to High</option>
          <option value="high-low">Price: High to Low</option>
        </select>

        <button type="button" id="services-clear-filters">
          Clear Filters
        </button>

      </div>

    </div>

    <div class="archive-bulk-toolbar">
      <label class="archive-select-all-label">
        <input type="checkbox" id="select-all-active-services">
        Select All
      </label>
      <span id="active-services-selected-count">0 selected</span>
      <button type="button" id="archive-selected-services" class="archive-record-btn" disabled>
        Archive Selected
      </button>
    </div>

    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th>Select</th>
            <th>Service</th>
            <th>Description</th>
            <th>Price</th>
            <th>Duration (min)</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

    </div>

    <div id="services-pagination" class="pagination-container" aria-live="polite">
      </div>

  </main>
</div>

<script src="script.js"></script>
<script src="auth.js"></script>
<script src="logout.js"></script>
</body>
</html>
