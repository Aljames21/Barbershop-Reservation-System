
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services Management</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="services">
<div class="layout">

  <nav class="sidebar">
    <img class="logo" src="logo.jpg" alt="Sañado's Barbershop logo">
    <br>

    <a href="dashboard.html">
      <img src="icons/dashboardwhite.png" alt=""> Dashboard
    </a>

    <a href="staffs.html">
      <img src="icons/barberwhite.png" alt=""> Staffs
    </a>

    <a href="services.html" class="active">
      <img src="icons/Scissors_Icon.png" alt="service"> Services
    </a>

    <a href="appointments.html">
      <img src="icons/appointmentwhite.png" alt=""> Appointments
    </a>

    <a href="feedback.html">
      <img src="icons/customerwhite.png" alt="Feedback"> Feedback
    </a>

    <a href="index.html" class="logout">
      <img src="icons/logout (2).png" alt=""> Log out
    </a>
  </nav>

  <main class="main">

    <div class="toolbar">
      <h1>Services Management</h1>
      <button id="add-btn">Add service</button>
    </div>

    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th>Service</th>
            <th>Description</th>
            <th>Price</th>
            <th>Duration (min)</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

  </main>
</div>

<script src="script.js"></script>
<script src="auth.js"></script>
</body>
</html>
