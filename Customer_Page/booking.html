<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sañado's Barbershop</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="booking.css">
</head>
<body>

    <header class="book-header">
        <a href="index.html" class="head">
                <img class="logo" src="images/logo.jpg" alt="logo">
            </a>

        <a href="index.html" class="back-link">Back</a>
    </header>

    <main class="book-page">
        <section class="book-intro">
            <p class="title"><span class="span-1">SAÑADO'S</span> BARBERSHOP</p>

            <h1>Book an appointment</h1>

            <p>Choose your service and preferred schedule
                for your next appointment.
            </p>
        </section>

        <section class="book-info">
            <h2>Appointment Details</h2>

            <aside class="reservation-summary" aria-live="polite">
                <h3>Reservation Information</h3>

                <p class="summary-message" id="summary-message">Please select a service to continue.</p>

                <dl class="summary-details" id="summary-details" hidden>
                    
                    <div>
                        <dt>Service:</dt>
                        <dd id="summary-service"></dd>
                    </div>

                    <div>
                    <dt id="barber-selection" hidden>
                    Barber Staff:</dt>
                    <dd id="selected-barber"></dd>
                </div>

                    <div>
                        <dt>Price:</dt>
                        <dd id="summary-price"></dd>
                    </div>

                </dl>
            </aside>

            <form class="book-form" id="booking-form">
                <div class="input">
                    <label for="service">Choose a service</label>

                    <select name="service" id="service" required>
                       <option value="">Loading services...</option>
                    </select>
                </div>

                <div class="input">
                    <label for="date">Choose a date</label>
                    <input type="date" name="date" id="date" placeholder="Select a date" required>
                </div>

                <div class="input">
                    <label for="time">Pick a time</label>
                    <select name="time" id="time" required>
                        <option value="">Select a time</option>
                    </select>
                </div>

                <div class="input">
                    <label for="name">Name</label>
                    <input id="name" type="text" name="fullname" placeholder="Enter your fullname" required>
                </div>

                <div class="input">
                    <label for="contact">Email</label>
                    <input id="contact" type="email" name="contact" placeholder="Enter your email" required> 
                </div>


                

<div class="input">
    <label for="phoneNumber">Mobile Number</label>
    <input
        type="tel"
        id="phoneNumber"
        name="phoneNumber"
        placeholder="09XXXXXXXXX"
        inputmode="tel"
        pattern="09[0-9]{9}"
        maxlength="11"
        required
    >
</div>

<div class="input">
    <button type="button" id="sendOtpBtn">
        SEND OTP
    </button>
</div>

<div class="input" id="otpSection" hidden>
    <label for="otpCode">Verification Code</label>
    <input
        type="text"
        id="otpCode"
        placeholder="Enter 6-digit OTP"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        autocomplete="one-time-code"
    >

    <button type="button" id="verifyOtpBtn">
        VERIFY OTP
    </button>
</div>

<p id="otpStatus" role="status" aria-live="polite"></p>

<div id="recaptcha-container"></div>


                <div class="input">
                    <label for="message">Additional Message</label>
                    <textarea name="message" id="message" placeholder="Enter addtional details"></textarea>
                </div>

                <button type="submit" id="confirmBtn">CONFIRM APPOINTMENT</button>
            </form>

        </section>
    </main>

    <div id="confirmation"></div>

    <script src="booking.js"></script>
    
</body>
</html>
