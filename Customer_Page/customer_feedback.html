<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback | Sañado's Barbershop</title>
    <link rel="stylesheet" href="customer_feedback.css">
</head>
<body>
    <header class="feedback-header">
        <a href="index.html" aria-label="Sañado's Barbershop home">
            <img src="images/logo.jpg" alt="Sañado's Barbershop">
        </a>
        <a class="home-link" href="index.html">Home</a>
    </header>

    <main class="feedback-page">
        <p class="page-kicker">Your experience matters</p>
        <h1>Customer Feedback</h1>
        <p class="page-description">
            Thank you for visiting Sañado's Barbershop. Tell us about your
            experience and help us keep improving.
        </p>

        <section id="booking-summary" class="booking-summary" hidden aria-live="polite">
            <span>YOUR VISIT</span>
            <p><strong id="visit-service">Appointment</strong><time id="visit-date"></time></p>
        </section>

        <p id="feedback-message" class="feedback-message is-visible" role="status" aria-live="polite">
            Checking your review link...
        </p>

        <form id="feedback-form" class="feedback-card" hidden>
            <fieldset class="rating-field">
                <legend>Your rating <span aria-hidden="true">*</span></legend>
                <div class="rating-stars" role="radiogroup" aria-label="Choose a rating from 1 to 5 stars">
                    <input class="star-input" id="rating-1" type="radio" name="rating" value="1" required>
                    <label for="rating-1" aria-label="1 star" title="1 star">★</label>
                    <input class="star-input" id="rating-2" type="radio" name="rating" value="2">
                    <label for="rating-2" aria-label="2 stars" title="2 stars">★</label>
                    <input class="star-input" id="rating-3" type="radio" name="rating" value="3">
                    <label for="rating-3" aria-label="3 stars" title="3 stars">★</label>
                    <input class="star-input" id="rating-4" type="radio" name="rating" value="4">
                    <label for="rating-4" aria-label="4 stars" title="4 stars">★</label>
                    <input class="star-input" id="rating-5" type="radio" name="rating" value="5">
                    <label for="rating-5" aria-label="5 stars" title="5 stars">★</label>
                </div>
            </fieldset>

            <div class="comment-field">
                <label for="feedback-comment">Your review</label>
                <textarea
                    id="feedback-comment"
                    name="comment"
                    rows="6"
                    maxlength="1000"
                    required
                    aria-describedby="comment-count"
                    placeholder="What did you enjoy about your visit?"
                ></textarea>
                <p id="comment-count" class="character-count">0 / 1000</p>
            </div>

            <button id="submit-review" class="submit-button" type="submit">
                Submit Review
            </button>
        </form>
    </main>

    <script src="customer_feedback.js"></script>
</body>
</html>
